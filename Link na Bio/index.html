<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Empresa | Links</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones do FontAwesome para as redes sociais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
  
        <div class="profile">
            <img src="marca-sua-empresa-1024x1024-1.png" alt="Logo da Empresa" class="avatar">
            <h1>Nome da Empresa</h1>
            <p>Soluções práticas e atendimento rápido para você.</p>
        </div>

        <!-- Lista de Links / Botões -->
        <div class="links-list">
            <a href="https://wa.me/5521999999999?text=Olá!%20Vim%20pelo%20Instagram%20e%20gostaria%20de%20mais%20informações." target="_blank" class="btn whatsapp">
                <i class="fa-brands fa-whatsapp"></i> Falar pelo WhatsApp
            </a>

            <a href="https://seusite.com/cardapio" target="_blank" class="btn">
                <i class="fa-solid fa-utensils"></i> Ver Cardápio / Catálogo
            </a>

            <a href="https://instagram.com/suaconta" target="_blank" class="btn">
                <i class="fa-brands fa-instagram"></i> Siga no Instagram / Facebook 
            </a>

            <a href="https://maps.google.com" target="_blank" class="btn location">
                <i class="fa-solid fa-location-dot"></i> Nossa Localização
            </a>
        </div>

        <!-- Rodapé -->
        <footer class="footer">
            <p>Desenvolvido com tecnologia própria.</p>
        </footer>
    </div>

</body>
</html>
